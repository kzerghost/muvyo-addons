# 癫影每日大包解锁 — Docker Compose 单文件部署（执行端0.4.3）
# 使用方法：设置访问密码后创建项目。无需额外源码目录或config.json。
# 访问密码：24–128位字母、数字、下划线或短横线，首位为字母或数字；建议随机32位。
# 替换CHANGE_ME占位值，并在Muvyo插件中填写相同的“执行端访问密码”。
name: dian-bridge
x-dian-auth: &dian-auth
  DIAN_ACCESS_PASSWORD: "CHANGE_ME_TO_RANDOM_32_CHARACTERS"
services:
  browser:
    image: selenium/standalone-chromium:4.51.0-20261010
    user: seluser
    init: true
    restart: unless-stopped
    shm_size: 256m
    mem_limit: 1024m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      <<: *dian-auth
      MALLOC_ARENA_MAX: "2"
      MALLOC_TRIM_THRESHOLD_: "131072"
    entrypoint: ["python3", "-c", "import base64,gzip;exec(compile(gzip.decompress(base64.b64decode('')),'bundled-browser.py','exec'))"]
    healthcheck:
      test: ["CMD", "python3", "-c", "import os,hashlib,base64,urllib.request,json; p=hashlib.sha256(('dian-browser-internal-v1:'+os.environ['DIAN_ACCESS_PASSWORD']).encode()).hexdigest(); r=urllib.request.Request('http://127.0.0.1:4444/status',headers={'Authorization':'Basic '+base64.b64encode(('dian:'+p).encode()).decode()}); v=json.load(urllib.request.urlopen(r,timeout=3))['value']; raise SystemExit(0 if v.get('ready') is True and v.get('binariesReady') is True else 1)"]
      interval: 120s
      timeout: 5s
      retries: 3
      start_period: 30s
    volumes:
      - profiles:/home/seluser
    networks: [browser_net]
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
  worker:
    image: node:24-bookworm-slim
    user: "1000:1000"
    init: true
    restart: unless-stopped
    read_only: true
    mem_limit: 128m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:size=16m,mode=1777"]
    working_dir: /tmp
    environment:
      <<: *dian-auth
      MALLOC_ARENA_MAX: "2"
      MALLOC_TRIM_THRESHOLD_: "131072"
      DIAN_STATE_ROOT: /home/node
      DIAN_PROFILE_ROOT: /home/seluser
      # 容器兼容选项：true关闭Chromium自身沙箱；具备沙箱运行条件时可设false。
      # 此选项不改变非root运行、cap_drop或Docker容器隔离。
      BROWSER_NO_SANDBOX: "true"
    entrypoint: ["node", "--expose-gc", "-e", "const fs=require('node:fs'),z=require('node:zlib'),p=require('node:path');const files=JSON.parse(z.gunzipSync(Buffer.from('','base64'),{maxOutputLength:262144}));const dir='/tmp/dian-worker';fs.mkdirSync(dir,{recursive:true,mode:0o700});for(const [name,body]of Object.entries(files)){const match=name.match(/^[a-z][a-z0-9-]{0,60}\\.cjs/);if(!match||match[0]!==name||typeof body!=='string'||Buffer.byteLength(body)>131072)throw Error('bundle_invalid');fs.writeFileSync(p.join(dir,name),body,{mode:0o600});}require(p.join(dir,'server.cjs')).main();"]
    healthcheck:
      test: ["CMD", "node", "-e", "const r=require('node:http').get('http://127.0.0.1:8788/ready',{timeout:4000},r=>{let b='';r.on('data',c=>b+=c);r.on('end',()=>{try{process.exit(r.statusCode===200&&JSON.parse(b).ready===true?0:1)}catch{process.exit(1)}})});r.on('timeout',()=>r.destroy());r.on('error',()=>process.exit(1))"]
      interval: 120s
      timeout: 6s
      retries: 3
      start_period: 40s
    ports: ["${DIAN_BIND_IP:-0.0.0.0}:${DIAN_PORT:-8788}:8788"]
    volumes:
      - state:/home/node
    networks: [browser_net]
    depends_on:
      browser:
        condition: service_healthy
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
networks:
  browser_net: {}
volumes:
  profiles: {}
  state: {}
