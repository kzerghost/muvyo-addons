# 癫影每日大包解锁 — Docker Compose 单文件部署（执行端0.4.5）
# 目录挂载版 r1：先创建下列两个专用空目录，修改路径和密码后创建项目。
# 数据保存在你填写的目录，不创建 profiles/state 命名卷；不自动删除持久数据。
# 首次启动仅初始化挂载根目录权限，随后以非root运行；不递归更改已有文件。
# 部署与备份：https://github.com/kzerghost/muvyo-addons/blob/main/docs/DEPLOYMENT.md
# 访问密码：24–128位字母、数字、下划线或短横线，首位为字母或数字；建议随机32位。
# 替换CHANGE_ME占位值，并在Muvyo插件中填写相同的“执行端访问密码”。
name: dian-bridge
# 改成宿主机上自己创建的绝对路径；两个目录必须不同且仅供本项目使用。
x-dian-profiles-path: &dian-profiles-path "/volume1/docker/dian-bridge/data/profiles"
x-dian-state-path: &dian-state-path "/volume1/docker/dian-bridge/data/state"
x-dian-auth: &dian-auth
  DIAN_ACCESS_PASSWORD: "CHANGE_ME_TO_RANDOM_32_CHARACTERS"
services:
  browser:
    image: selenium/standalone-chromium:4.51.0-20261010
    user: "0:0"
    init: true
    restart: unless-stopped
    shm_size: 256m
    mem_limit: 1024m
    cap_drop: [ALL]
    # 用于目录初始化、降权和init转发停止信号；业务进程清空这些能力。
    cap_add: [CHOWN, SETUID, SETGID, KILL]
    security_opt: ["no-new-privileges:true"]
    environment:
      <<: *dian-auth
      HOME: /home/seluser
      MALLOC_ARENA_MAX: "2"
      MALLOC_TRIM_THRESHOLD_: "131072"
    entrypoint: ["python3", "-c", "import os,stat,pwd,secrets\ninit_root='/home/seluser'\nruntime_user=pwd.getpwnam('seluser')\nbefore=os.lstat(init_root)\nif not stat.S_ISDIR(before.st_mode) or stat.S_ISLNK(before.st_mode):\n    raise RuntimeError('profile_directory_invalid')\nos.lchown(init_root,0,0)\ninit_fd=os.open(init_root,os.O_RDONLY|os.O_DIRECTORY|os.O_NOFOLLOW)\ntry:\n    current=os.fstat(init_fd)\n    if (current.st_dev,current.st_ino)!=(before.st_dev,before.st_ino):\n        raise RuntimeError('profile_directory_changed')\n    os.fchmod(init_fd,stat.S_IMODE(current.st_mode)|0o700)\n    os.fchown(init_fd,runtime_user.pw_uid,runtime_user.pw_gid)\nfinally:\n    os.close(init_fd)\nimport os,pwd,re\nruntime_user=pwd.getpwnam('seluser')\nos.setgroups([])\nos.setgid(runtime_user.pw_gid)\nos.setuid(runtime_user.pw_uid)\nif os.getuid()!=runtime_user.pw_uid or os.geteuid()!=runtime_user.pw_uid or any(g!=runtime_user.pw_gid for g in os.getgroups()):\n    raise RuntimeError('runtime_identity_invalid')\nwith open('/proc/self/status') as status_file:\n    runtime_status=status_file.read()\nif not re.search(r'^CapEff:\\s+0+$$',runtime_status,re.M) or not re.search(r'^CapPrm:\\s+0+$$',runtime_status,re.M):\n    raise RuntimeError('runtime_capabilities_invalid')\nos.umask(0o077)\ninit_probe=init_root+'/.dian-write-probe-'+secrets.token_hex(12)\nprobe_fd=os.open(init_probe,os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW,0o600)\nos.close(probe_fd)\nos.unlink(init_probe)\nprint('dian storage ready; browser uid='+str(os.getuid()),flush=True)\nimport base64,gzip;exec(compile(gzip.decompress(base64.b64decode('')),'bundled-browser.py','exec'))"]
    healthcheck:
      test: ["CMD", "python3", "-c", "import os,pwd,re\nruntime_user=pwd.getpwnam('seluser')\nos.setgroups([])\nos.setgid(runtime_user.pw_gid)\nos.setuid(runtime_user.pw_uid)\nif os.getuid()!=runtime_user.pw_uid or os.geteuid()!=runtime_user.pw_uid or any(g!=runtime_user.pw_gid for g in os.getgroups()):\n    raise RuntimeError('runtime_identity_invalid')\nwith open('/proc/self/status') as status_file:\n    runtime_status=status_file.read()\nif not re.search(r'^CapEff:\\s+0+$$',runtime_status,re.M) or not re.search(r'^CapPrm:\\s+0+$$',runtime_status,re.M):\n    raise RuntimeError('runtime_capabilities_invalid')\nos.umask(0o077)\nimport os,hashlib,base64,urllib.request,json; p=hashlib.sha256(('dian-browser-internal-v1:'+os.environ['DIAN_ACCESS_PASSWORD']).encode()).hexdigest(); r=urllib.request.Request('http://127.0.0.1:4444/status',headers={'Authorization':'Basic '+base64.b64encode(('dian:'+p).encode()).decode()}); v=json.load(urllib.request.urlopen(r,timeout=3))['value']; raise SystemExit(0 if v.get('ready') is True and v.get('binariesReady') is True else 1)"]
      interval: 120s
      timeout: 5s
      retries: 3
      start_period: 30s
    volumes:
      - type: bind
        source: *dian-profiles-path
        target: /home/seluser
        bind: {create_host_path: false}
    networks: [browser_net]
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
  worker:
    image: node:24-bookworm-slim
    user: "0:0"
    init: true
    restart: unless-stopped
    read_only: true
    mem_limit: 128m
    cap_drop: [ALL]
    # 用于目录初始化、降权和init转发停止信号；业务进程清空这些能力。
    cap_add: [CHOWN, SETUID, SETGID, KILL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:size=16m,mode=1777"]
    working_dir: /tmp
    environment:
      <<: *dian-auth
      MALLOC_ARENA_MAX: "2"
      MALLOC_TRIM_THRESHOLD_: "131072"
      HOME: /home/node
      DIAN_STATE_ROOT: /home/node
      DIAN_PROFILE_ROOT: /home/seluser
      # 容器兼容选项：true关闭Chromium自身沙箱；具备沙箱运行条件时可设false。
      # 浏览器及任务服务在存储初始化后以非root运行，保留Docker隔离。
      BROWSER_NO_SANDBOX: "true"
    entrypoint: ["node", "--expose-gc", "-e", "const initFs=require('node:fs'),initRoot='/home/node';const before=initFs.lstatSync(initRoot);if(!before.isDirectory()||before.isSymbolicLink())throw Error('state_directory_invalid');initFs.lchownSync(initRoot,0,0);const initFd=initFs.openSync(initRoot,initFs.constants.O_RDONLY|initFs.constants.O_DIRECTORY|initFs.constants.O_NOFOLLOW);try{const current=initFs.fstatSync(initFd);if(current.dev!==before.dev||current.ino!==before.ino)throw Error('state_directory_changed');initFs.fchmodSync(initFd,(current.mode&0o777)|0o700);initFs.fchownSync(initFd,1000,1000);}finally{initFs.closeSync(initFd);} process.setgroups([]);process.setgid(1000);process.setuid(1000);if(process.getuid()!==1000||process.geteuid()!==1000||process.getgroups().some(g=>g!==1000))throw Error('runtime_identity_invalid');const runtimeStatus=require('node:fs').readFileSync('/proc/self/status','utf8');if(!/^CapEff:\\s+0+$$/m.test(runtimeStatus)||!/^CapPrm:\\s+0+$$/m.test(runtimeStatus))throw Error('runtime_capabilities_invalid');process.umask(0o077);const initProbe=initRoot+'/.dian-write-probe-'+require('node:crypto').randomBytes(12).toString('hex');const probeFd=initFs.openSync(initProbe,'wx',0o600);initFs.closeSync(probeFd);initFs.unlinkSync(initProbe);console.log('dian storage ready; worker uid='+process.getuid());const fs=require('node:fs'),z=require('node:zlib'),p=require('node:path');const files=JSON.parse(z.gunzipSync(Buffer.from('','base64'),{maxOutputLength:262144}));const dir='/tmp/dian-worker';fs.mkdirSync(dir,{recursive:true,mode:0o700});for(const [name,body]of Object.entries(files)){const match=name.match(/^[a-z][a-z0-9-]{0,60}\\.cjs/);if(!match||match[0]!==name||typeof body!=='string'||Buffer.byteLength(body)>131072)throw Error('bundle_invalid');fs.writeFileSync(p.join(dir,name),body,{mode:0o600});}require(p.join(dir,'server.cjs')).main();"]
    healthcheck:
      test: ["CMD", "node", "-e", "process.setgroups([]);process.setgid(1000);process.setuid(1000);if(process.getuid()!==1000||process.geteuid()!==1000||process.getgroups().some(g=>g!==1000))throw Error('runtime_identity_invalid');const runtimeStatus=require('node:fs').readFileSync('/proc/self/status','utf8');if(!/^CapEff:\\s+0+$$/m.test(runtimeStatus)||!/^CapPrm:\\s+0+$$/m.test(runtimeStatus))throw Error('runtime_capabilities_invalid');process.umask(0o077);const r=require('node:http').get('http://127.0.0.1:8788/ready',{timeout:4000},r=>{let b='';r.on('data',c=>b+=c);r.on('end',()=>{try{process.exit(r.statusCode===200&&JSON.parse(b).ready===true?0:1)}catch{process.exit(1)}})});r.on('timeout',()=>r.destroy());r.on('error',()=>process.exit(1))"]
      interval: 120s
      timeout: 6s
      retries: 3
      start_period: 40s
    ports: ["${DIAN_BIND_IP:-0.0.0.0}:${DIAN_PORT:-8788}:8788"]
    volumes:
      - type: bind
        source: *dian-state-path
        target: /home/node
        bind: {create_host_path: false}
    networks: [browser_net]
    depends_on:
      browser:
        condition: service_healthy
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
networks:
  browser_net: {}
